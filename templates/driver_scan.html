<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Invoice - Smart Marg Driver</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }

        /* Full screen scanner */
        #reader {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Overlay with instructions */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .header {
            background: rgba(0,0,0,0.8);
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .header p {
            color: #aaa;
            font-size: 0.9em;
        }

        .scanning-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            border: 3px solid #4CAF50;
            border-radius: 20px;
            box-shadow: 0 0 0 99999px rgba(0, 0, 0, 0.5);
        }

        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #4CAF50;
        }

        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-radius: 20px 0 0 0;
        }

        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 20px 0 0;
        }

        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 20px;
        }

        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 20px 0;
        }

        .instruction {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 90%;
        }

        .instruction h2 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        /* Status message */
        .status {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76, 175, 80, 0.95);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            z-index: 100;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                top: -50px;
                opacity: 0;
            }
            to {
                top: 100px;
                opacity: 1;
            }
        }

        .status.error {
            background: rgba(244, 67, 54, 0.95);
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .spinner {
            border: 5px solid #333;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            position: absolute;
            margin-top: 100px;
            color: white;
            font-size: 1.2em;
        }

        /* Manual entry button */
        .manual-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 15px 30px;
            border: 2px solid white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            pointer-events: all;
            z-index: 50;
        }

        .manual-btn:active {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <!-- Scanner View -->
    <div id="reader"></div>

    <!-- Overlay -->
    <div class="overlay">
        <div class="header">
            <h1>📱 Smart Marg Driver</h1>
            <p>Point camera at invoice QR code</p>
        </div>

        <div class="scanning-frame">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
        </div>

        <div class="instruction">
            <h2>📋 Align QR code within frame</h2>
            <p>Scanner will detect automatically</p>
        </div>
    </div>

    <!-- Status Message -->
    <div id="status" class="status"></div>

    <!-- Loading -->
    <div id="loading" class="loading">
        <div>
            <div class="spinner"></div>
            <div class="loading-text">Loading map...</div>
        </div>
    </div>

    <!-- Manual Entry -->
    <button class="manual-btn" onclick="manualEntry()">✍️ Manual Entry</button>

    <script>
        let html5QrcodeScanner = null;
        let isProcessing = false;

        // Start scanner when page loads
        window.onload = function() {
            startScanner();
        };

        async function startScanner() {
            try {
                // Get back camera (environment facing)
                const devices = await Html5Qrcode.getCameras();
                
                if (!devices || devices.length === 0) {
                    showStatus('No camera found', 'error');
                    return;
                }

                // Find back camera
                let cameraId = devices[0].id;
                for (let device of devices) {
                    if (device.label.toLowerCase().includes('back') || 
                        device.label.toLowerCase().includes('environment')) {
                        cameraId = device.id;
                        break;
                    }
                }

                html5QrcodeScanner = new Html5Qrcode("reader");
                
                // Start scanning with back camera
                await html5QrcodeScanner.start(
                    cameraId,
                    {
                        fps: 10,
                        qrbox: { width: 280, height: 280 }
                    },
                    onScanSuccess,
                    onScanError
                );

            } catch (err) {
                console.error('Scanner error:', err);
                showStatus('Camera access denied', 'error');
            }
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            // Stop scanner
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().catch(e => console.log(e));
            }

            showStatus('✅ QR Code detected!', 'success');
            
            // Process QR code
            processQRCode(decodedText);
        }

        function onScanError(errorMessage) {
            // Ignore scanning errors (too noisy)
        }

        function processQRCode(qrData) {
            // Extract SAP code from invoice QR
            // Format: Con:192355(CONSIGNEE NAME)
            const sapMatch = qrData.match(/Con:(\d+)\(/);
            
            if (sapMatch && sapMatch[1]) {
                const sapCode = sapMatch[1];
                showLoading(true);
                submitSAPCode(sapCode);
            } else {
                showStatus('❌ Invalid QR format', 'error');
                isProcessing = false;
                setTimeout(() => {
                    if (html5QrcodeScanner) {
                        startScanner();
                    }
                }, 2000);
            }
        }

        async function submitSAPCode(sapCode) {
            try {
                const response = await fetch('/driver/view-map', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ sap_code: sapCode })
                });

                const data = await response.json();
                
                if (data.success && data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    showStatus('❌ Route not found', 'error');
                    showLoading(false);
                    isProcessing = false;
                    setTimeout(() => startScanner(), 2000);
                }
            } catch (error) {
                showStatus('❌ Network error', 'error');
                showLoading(false);
                isProcessing = false;
                setTimeout(() => startScanner(), 2000);
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + (type || '');
            statusDiv.style.display = 'block';

            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function manualEntry() {
            const sapCode = prompt('Enter SAP Code:');
            if (sapCode && sapCode.trim()) {
                showLoading(true);
                submitSAPCode(sapCode.trim());
            }
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().catch(e => console.log(e));
            }
        });
    </script>
</body>
</html>
