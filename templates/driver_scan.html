<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Invoice - Smart Marg Driver</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Best QR Scanner Library: qr-scanner by Nimiq -->
    <script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        /* Video Container */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
        }

        #qr-video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Scanning Overlay */
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #4CAF50;
            border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .scan-overlay::before,
        .scan-overlay::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #4CAF50;
        }

        .scan-overlay::before {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-radius: 20px 0 0 0;
        }

        .scan-overlay::after {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 20px 0 0;
        }

        .scan-corner-bl,
        .scan-corner-br {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #4CAF50;
        }

        .scan-corner-bl {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 20px;
        }

        .scan-corner-br {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 20px 0;
        }

        /* Scan Line Animation */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4CAF50, transparent);
            top: 0;
            animation: scan 2s ease-in-out infinite;
        }

        @keyframes scan {
            0%, 100% { top: 0; }
            50% { top: 100%; }
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-group .btn {
            flex: 1;
        }

        /* Status Messages */
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .status.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #17a2b8;
        }

        /* Manual Entry */
        .manual-entry {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .manual-entry h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Flashlight Control */
        .flashlight-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
        }

        .flashlight-btn:hover {
            background: rgba(0,0,0,0.8);
        }

        .flashlight-btn.active {
            background: #ffc107;
            color: #333;
        }

        /* Initializing Overlay */
        .initializing-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 15;
            color: white;
        }

        .initializing-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .initializing-overlay p {
            font-size: 16px;
            font-weight: 600;
        }

        /* Debug Info */
        .debug-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 12px;
            color: #666;
            font-family: monospace;
            display: none;
        }

        .debug-info.show {
            display: block;
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1><i class="fas fa-qrcode"></i> Smart Marg</h1>
                <p>Scan Invoice QR Code to Access Your Route</p>
            </div>

            <!-- Status Message -->
            <div id="statusMessage" class="status">
                <span id="statusText"></span>
            </div>

            <!-- Video Container with Overlay -->
            <div class="video-container" id="videoContainer">
                <video id="qr-video" muted playsinline></video>
                
                <!-- Initializing Overlay -->
                <div class="initializing-overlay" id="initOverlay">
                    <div class="spinner"></div>
                    <p>Initializing camera...</p>
                </div>
                
                <!-- Flashlight Button -->
                <button class="flashlight-btn hidden" id="flashlightBtn" onclick="toggleFlashlight()">
                    <i class="fas fa-lightbulb"></i>
                </button>
                
                <!-- Scanning Overlay -->
                <div class="scan-overlay">
                    <div class="scan-line"></div>
                    <div class="scan-corner-bl"></div>
                    <div class="scan-corner-br"></div>
                </div>
            </div>

            <!-- Manual Entry -->
            <div class="manual-entry">
                <h3><i class="fas fa-keyboard"></i> Manual Entry</h3>
                <div class="input-group">
                    <input type="text" id="manualInput" placeholder="Enter SAP Code (e.g., 192355)" maxlength="10">
                    <button class="btn btn-success" onclick="manualSubmit()" style="width: auto; padding: 12px 20px;">
                        <i class="fas fa-search"></i> Find
                    </button>
                </div>
            </div>

            <!-- Debug Info -->
            <div id="debugInfo" class="debug-info">
                <strong>🔍 Debug Info:</strong><br>
                Last scanned: <span id="debugScanned">-</span><br>
                Extracted SAP: <span id="debugSAP">-</span><br>
                Response: <span id="debugResponse">-</span>
            </div>
        </div>
    </div>

    <script>
        // Set worker path for qr-scanner
        QrScanner.WORKER_PATH = 'https://unpkg.com/qr-scanner@1.4.2/qr-scanner-worker.min.js';

        let scanner = null;
        let currentCameraId = null;
        let hasFlashlight = false;

        // Load cameras and start scanner automatically
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCameras();
            // Auto-start scanner after cameras are loaded
            setTimeout(() => {
                startScanner();
            }, 500);
        });

        async function loadCameras() {
            try {
                const hasCamera = await QrScanner.hasCamera();
                
                if (!hasCamera) {
                    showStatus('❌ No camera found. Use manual entry below.', 'error');
                    document.getElementById('videoContainer').classList.add('hidden');
                    return;
                }

                const cameras = await QrScanner.listCameras(true);
                
                if (cameras && cameras.length > 0) {
                    // Auto-select back/rear camera
                    for (const camera of cameras) {
                        const label = camera.label.toLowerCase();
                        if (label.includes('back') || label.includes('rear') || label.includes('environment')) {
                            currentCameraId = camera.id;
                            break;
                        }
                    }
                    
                    // If no back camera, use first camera
                    if (!currentCameraId) {
                        currentCameraId = cameras[0].id;
                    }
                    
                    showStatus('✅ Camera ready. Starting scanner...', 'info');
                } else {
                    showStatus('❌ No cameras detected. Use manual entry below.', 'error');
                    document.getElementById('videoContainer').classList.add('hidden');
                }
            } catch (err) {
                console.error('Camera access error:', err);
                showStatus('❌ Camera access denied. Use manual entry below.', 'error');
                document.getElementById('videoContainer').classList.add('hidden');
            }
        }

        async function startScanner() {
            try {
                const videoElem = document.getElementById('qr-video');
                
                if (!currentCameraId) {
                    showStatus('⏳ Waiting for camera...', 'info');
                    setTimeout(startScanner, 1000);
                    return;
                }
                
                // Create scanner instance
                scanner = new QrScanner(
                    videoElem,
                    result => onScanSuccess(result),
                    {
                        returnDetailedScanResult: true,
                        highlightScanRegion: false,
                        highlightCodeOutline: false,
                        preferredCamera: currentCameraId,
                        maxScansPerSecond: 5
                    }
                );

                // Start scanning
                await scanner.start();
                
                // Hide initializing overlay
                document.getElementById('initOverlay').classList.add('hidden');
                
                // Check for flashlight support
                hasFlashlight = await scanner.hasFlash();
                if (hasFlashlight) {
                    document.getElementById('flashlightBtn').classList.remove('hidden');
                }
                
                showStatus('📷 Scanner active. Point at QR code...', 'success');
                
            } catch (err) {
                console.error('Scanner start error:', err);
                showStatus('❌ Camera access denied. Use manual entry below.', 'error');
                document.getElementById('videoContainer').classList.add('hidden');
            }
        }

        async function toggleFlashlight() {
            if (!scanner || !hasFlashlight) return;
            
            try {
                const btn = document.getElementById('flashlightBtn');
                await scanner.toggleFlash();
                btn.classList.toggle('active');
            } catch (err) {
                console.error('Flashlight error:', err);
            }
        }

        function onScanSuccess(result) {
            console.log('✅ QR Code detected:', result);
            
            const qrData = result.data;
            
            // Show debug info
            document.getElementById('debugScanned').textContent = qrData;
            document.getElementById('debugInfo').classList.add('show');
            
            // Stop scanner immediately
            if (scanner) {
                scanner.stop();
                scanner.destroy();
                scanner = null;
            }
            
            // Extract SAP code - Multiple formats
            let sapCode = null;
            
            // Pattern 1: Con:192355(...)
            let match = qrData.match(/Con:(\d+)/);
            if (match) sapCode = match[1];
            
            // Pattern 2: SAP:192355 or SAP 192355
            if (!sapCode) {
                match = qrData.match(/SAP[:\s]*(\d+)/i);
                if (match) sapCode = match[1];
            }
            
            // Pattern 3: Just numbers (6-10 digits)
            if (!sapCode) {
                match = qrData.match(/^(\d{6,10})$/);
                if (match) sapCode = match[1];
            }
            
            if (sapCode) {
                // Clean SAP code (remove .0 if present)
                if (sapCode.includes('.')) {
                    sapCode = String(parseInt(parseFloat(sapCode)));
                }
                
                document.getElementById('debugSAP').textContent = sapCode;
                showStatus(`✅ QR Scanned! SAP Code: ${sapCode}`, 'success');
                
                // Submit to server
                setTimeout(() => {
                    submitSAPCode(sapCode);
                }, 1000);
                
            } else {
                document.getElementById('debugSAP').textContent = 'Not found';
                showStatus('❌ No SAP code found in QR', 'error');
                
                setTimeout(() => {
                    showStatus(`Scanned: "${qrData.substring(0, 50)}..."`, 'info');
                }, 2000);
                
                // Restart scanner
                setTimeout(() => {
                    startScanner();
                }, 3000);
            }
        }

        async function submitSAPCode(sapCode) {
            try {
                showStatus('🔍 Looking for route map...', 'info');
                
                const response = await fetch('/driver/view-map', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ sap_code: sapCode })
                });

                const data = await response.json();
                document.getElementById('debugResponse').textContent = JSON.stringify(data);
                
                if (data.success && data.redirect) {
                    showStatus('✅ Route found! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    const errorMsg = data.error || 'Route not found';
                    showStatus(`❌ ${errorMsg}`, 'error');
                    
                    setTimeout(() => {
                        showStatus(`💡 Route for SAP ${sapCode} not saved. Please create it first.`, 'info');
                    }, 3000);
                }
            } catch (error) {
                console.error('Submit error:', error);
                document.getElementById('debugResponse').textContent = error.toString();
                showStatus('❌ Network error. Check connection.', 'error');
            }
        }

        function manualSubmit() {
            let sapCode = document.getElementById('manualInput').value.trim();
            
            if (!sapCode) {
                showStatus('❌ Please enter a SAP code', 'error');
                return;
            }
            
            // Validate and clean
            if (!/^\d+\.?\d*$/.test(sapCode)) {
                showStatus('❌ SAP code must contain only numbers', 'error');
                return;
            }
            
            // Remove .0 if present
            if (sapCode.includes('.')) {
                sapCode = String(parseInt(parseFloat(sapCode)));
            }
            
            // Update debug
            document.getElementById('debugScanned').textContent = `Manual: ${sapCode}`;
            document.getElementById('debugSAP').textContent = sapCode;
            document.getElementById('debugInfo').classList.add('show');
            
            submitSAPCode(sapCode);
        }

        // Enter key support
        document.getElementById('manualInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') manualSubmit();
        });

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            
            statusText.textContent = message;
            statusEl.className = `status show status-${type}`;
            
            // Auto-hide after 5 seconds for success messages
            if (type === 'success') {
                setTimeout(() => {
                    statusEl.classList.remove('show');
                }, 5000);
            }
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (scanner) {
                scanner.stop();
                scanner.destroy();
            }
        });
    </script>
</body>
</html>
