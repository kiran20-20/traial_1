<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Route</title>
    <!-- Use Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Font Awesome for the icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Style for the button loading spinner */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-8 md:p-12">
    <div class="max-w-6xl mx-auto">
        <!-- Main heading with icon -->
        <h2 class="text-3xl font-bold text-center mb-12 text-gray-800">
            <i class="fas fa-route text-blue-500 mr-3"></i> Select the Route You Prefer
        </h2>

        <div id="route-container" class="flex flex-col gap-8">
            <!-- Example route block - this would be dynamically generated by your backend -->
            <!-- The button's functionality is handled by the JavaScript below -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col md:flex-row">
                <div class="p-6 md:p-8 flex-1 border-b md:border-b-0 md:border-r border-gray-200">
                    <h3 class="text-xl font-semibold mb-2 text-gray-800">Route 1: Quickest Route</h3>
                    <p class="text-sm text-gray-600 mb-1"><strong>Distance:</strong> 15.2 miles</p>
                    <p class="text-sm text-gray-600 mb-4"><strong>Duration:</strong> 25 minutes</p>
                    <form onsubmit="handleFormSubmit(event)">
                        <input type="hidden" name="route_index" value="0">
                        <button type="submit" class="w-full md:w-auto px-6 py-3 bg-blue-600 text-white font-medium rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                            Select This Route
                        </button>
                    </form>
                </div>
                <!-- The iframe for the map preview -->
                <div class="flex-1">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.2599298453476!2d-73.98779958459495!3d40.7484406793282!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25988e0b67323%3A0xb36f735d46171569!2sEmpire%20State%20Building!5e0!3m2!1sen!2sus!4v1628172051649!5m2!1sen!2sus"
                        width="100%"
                        height="280"
                        style="border:0; border-radius: 0 0 12px 12px; md:border-radius: 0 12px 12px 0;"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        title="Map preview for Route 1"></iframe>
                </div>
            </div>

            <!-- Another example route block -->
            <div class="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col md:flex-row">
                <div class="p-6 md:p-8 flex-1 border-b md:border-b-0 md:border-r border-gray-200">
                    <h3 class="text-xl font-semibold mb-2 text-gray-800">Route 2: Scenic Route</h3>
                    <p class="text-sm text-gray-600 mb-1"><strong>Distance:</strong> 18.5 miles</p>
                    <p class="text-sm text-gray-600 mb-4"><strong>Duration:</strong> 35 minutes</p>
                    <form onsubmit="handleFormSubmit(event)">
                        <input type="hidden" name="route_index" value="1">
                        <button type="submit" class="w-full md:w-auto px-6 py-3 bg-blue-600 text-white font-medium rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                            Select This Route
                        </button>
                    </form>
                </div>
                <div class="flex-1">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3024.198305898863!2d-74.01358948459632!3d40.71277667933107!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25a165ae64b73%3A0xf69c4a40875c2e1!2sOne%20World%20Trade%20Center!5e0!3m2!1sen!2sus!4v1628172088825!5m2!1sen!2sus"
                        width="100%"
                        height="280"
                        style="border:0; border-radius: 0 0 12px 12px; md:border-radius: 0 12px 12px 0;"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        title="Map preview for Route 2"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple JavaScript to handle form submission and show a loading state
        function handleFormSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const button = form.querySelector('button');
            
            // Disable the button and show a loading spinner
            button.disabled = true;
            button.innerHTML = '<div class="loader mx-auto"></div>';

            // Simulate form submission to a backend
            setTimeout(() => {
                const routeIndex = form.querySelector('input[name="route_index"]').value;
                alert(`Route ${parseInt(routeIndex) + 1} has been selected!`);
                // You would typically submit the form here:
                // form.submit();
                
                // Re-enable the button and restore the text after a "response"
                button.disabled = false;
                button.innerHTML = 'Select This Route';
            }, 1500); // Simulate a 1.5 second network request
        }
    </script>
</body>
</html>
