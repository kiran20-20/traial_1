<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Route</title>
    <!-- Use Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Font Awesome for the icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Style for the button loading spinner */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-8 md:p-12">
    <div class="max-w-6xl mx-auto">
        <!-- Main heading with icon -->
        <h2 class="text-3xl font-bold text-center mb-12 text-gray-800">
            <i class="fas fa-route text-blue-500 mr-3"></i> Select the Route You Prefer
        </h2>

        <div id="route-container" class="flex flex-col gap-8">
            {% for route in routes %}
            <div class="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col md:flex-row">
                <div class="p-6 md:p-8 flex-1 border-b md:border-b-0 md:border-r border-gray-200">
                    <h3 class="text-xl font-semibold mb-2 text-gray-800">{{ route.summary }}</h3>
                    <p class="text-sm text-gray-600 mb-1"><strong>Distance:</strong> {{ route.distance }}</p>
                    <p class="text-sm text-gray-600 mb-4"><strong>Duration:</strong> {{ route.duration }}</p>
                    <form onsubmit="handleFormSubmit(event)">
                        <input type="hidden" name="route_index" value="{{ route.index }}">
                        <button type="submit" class="w-full md:w-auto px-6 py-3 bg-blue-600 text-white font-medium rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                            Select This Route
                        </button>
                    </form>
                </div>
                <div class="flex-1">
                    <iframe src="{{ url_for('view_preview', filename=route.preview_file) }}?v={{ loop.index }}"
                        width="100%"
                        height="280"
                        style="border:0; border-radius: 0 0 12px 12px; md:border-radius: 0 12px 12px 0;"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        title="Map preview for route {{ loop.index }}"></iframe>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        // Simple JavaScript to handle form submission and show a loading state
        function handleFormSubmit(event) {
            event.preventDefault(); // Prevents the default form submission
            const form = event.target;
            const button = form.querySelector('button');
            const originalText = button.innerHTML; // Store original button text

            // Disable the button and show a loading spinner
            button.disabled = true;
            button.innerHTML = '<div class="loader mx-auto"></div>';

            // Here you would typically make a real API call or submit the form.
            // For this example, we'll use a setTimeout to simulate a network request.
            setTimeout(() => {
                const routeIndex = form.querySelector('input[name="route_index"]').value;
                
                // You can add logic here to navigate to the next page or show a success message.
                // For now, we'll just show an alert.
                alert(`Route ${parseInt(routeIndex) + 1} has been selected!`);

                // Re-enable the button and restore the text
                button.disabled = false;
                button.innerHTML = originalText;
                
                // If you want to submit the form after the loading state, you can use:
                // form.submit();
            }, 1500); // Simulate a 1.5 second network request
        }
    </script>
</body>
</html>
