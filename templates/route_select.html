<!DOCTYPE html>
<html>
<head>
    <title>Select Route</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
        }
        .route-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 1100px;
            margin: auto;
        }
        .route-block {
            display: flex;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
        }
        .route-info {
            flex: 1;
            padding: 25px;
            border-right: 1px solid #eee;
        }
        .route-info h3 {
            margin-top: 0;
            font-size: 20px;
        }
        .route-info p {
            font-size: 14px;
            margin: 5px 0;
        }
        .route-info form {
            margin-top: 15px;
        }
        .route-info button {
            background-color: #007aff;
            color: white;
            padding: 10px 18px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
        }
        .route-info button:hover {
            background-color: #005fcc;
        }
        .route-info button.loading {
            background-color: #999;
            cursor: not-allowed;
        }
        .btn-text {
            transition: opacity 0.3s ease;
        }
        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff40;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        .route-info button.loading .btn-text {
            display: none;
        }
        .route-info button.loading .loading-spinner {
            display: block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .route-map {
            flex: 2;
        }
        iframe {
            width: 100%;
            height: 280px;
            border: none;
        }
        @media (max-width: 768px) {
            .route-block {
                flex-direction: column;
            }
            .route-info {
                border-right: none;
                border-bottom: 1px solid #eee;
            }
            iframe {
                height: 240px;
            }
        }
    </style>
</head>
<body>
    <h2 style="text-align: center; margin-bottom: 40px;">
        <i class="fas fa-route"></i> Select the Route You Prefer
    </h2>
    <div class="route-container">
        {% for route in routes %}
        <div class="route-block">
            <div class="route-info">
                <h3>{{ route.summary }}</h3>
                <p><strong>Distance:</strong> {{ route.distance }}</p>
                <p><strong>Duration:</strong> {{ route.duration }}</p>
                <form method="POST" action="{{ url_for('analyze_route') }}">
                    <input type="hidden" name="route_index" value="{{ route.index }}">
                    <button type="submit" onclick="showLoading(this)">
                        <span class="btn-text">Select This Route</span>
                        <div class="loading-spinner"></div>
                    </button>
                </form>
            </div>
            <div class="route-map">
                <iframe src="{{ url_for('view_preview', filename=route.preview_file) }}?v={{ loop.index }}"></iframe>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        function showLoading(button) {
            // Disable all buttons
            const allButtons = document.querySelectorAll('button[type="submit"]');
            allButtons.forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.6';
            });
            
            // Show loading spinner on clicked button
            button.classList.add('loading');
            button.disabled = false;
            button.style.opacity = '1';
        }
    </script>
</body>
</html>
