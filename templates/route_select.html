<!DOCTYPE html>
<html>
<head>
    <title>Select Route</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
        }
        .route-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 1100px;
            margin: auto;
        }
        .route-block {
            display: flex;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
        }
        .route-info {
            flex: 1;
            padding: 25px;
            border-right: 1px solid #eee;
        }
        .route-info h3 {
            margin-top: 0;
            font-size: 20px;
        }
        .route-info p {
            font-size: 14px;
            margin: 5px 0;
        }
        .route-info form {
            margin-top: 15px;
        }
        .route-info button {
            background-color: #007aff;
            color: white;
            padding: 10px 18px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            min-width: 140px;
            transition: all 0.3s ease;
        }
        .route-info button:hover:not(.loading) {
            background-color: #005fcc;
        }
        .route-info button.loading {
            background-color: #666;
            cursor: not-allowed;
            pointer-events: none;
        }
        .route-info button .button-text {
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .route-info button.loading .button-text {
            opacity: 0;
        }
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .loading-spinner.active {
            opacity: 1;
        }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .route-map {
            flex: 2;
        }
        iframe {
            width: 100%;
            height: 280px;
            border: none;
        }
        
        /* Loading overlay for entire page */
        .page-loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.1);
            display: none;
            z-index: 1000;
        }
        .page-loading-overlay.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .route-block {
                flex-direction: column;
            }
            .route-info {
                border-right: none;
                border-bottom: 1px solid #eee;
            }
            iframe {
                height: 240px;
            }
        }
    </style>
</head>
<body>
    <!-- Page loading overlay -->
    <div class="page-loading-overlay" id="pageLoadingOverlay"></div>
    
    <h2 style="text-align: center; margin-bottom: 40px;">
        <i class="fas fa-route"></i> Select the Route You Prefer
    </h2>
    <div class="route-container">
        {% for route in routes %}
        <div class="route-block">
            <div class="route-info">
                <h3>{{ route.summary }}</h3>
                <p><strong>Distance:</strong> {{ route.distance }}</p>
                <p><strong>Duration:</strong> {{ route.duration }}</p>
                <form method="POST" action="{{ url_for('analyze_route') }}" class="route-form">
                    <input type="hidden" name="route_index" value="{{ route.index }}">
                    <button type="submit" class="route-button">
                        <span class="button-text">Select This Route</span>
                        <div class="loading-spinner">
                            <div class="spinner"></div>
                        </div>
                    </button>
                </form>
            </div>
            <div class="route-map">
                <iframe src="{{ url_for('view_preview', filename=route.preview_file) }}?v={{ loop.index }}"></iframe>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const forms = document.querySelectorAll('.route-form');
            const pageOverlay = document.getElementById('pageLoadingOverlay');
            
            forms.forEach(form => {
                form.addEventListener('submit', function(e) {
                    const button = this.querySelector('.route-button');
                    const spinner = button.querySelector('.loading-spinner');
                    
                    // Add loading state to clicked button
                    button.classList.add('loading');
                    spinner.classList.add('active');
                    
                    // Disable all other buttons
                    forms.forEach(otherForm => {
                        const otherButton = otherForm.querySelector('.route-button');
                        if (otherButton !== button) {
                            otherButton.disabled = true;
                            otherButton.style.opacity = '0.5';
                        }
                    });
                    
                    // Show page overlay
                    pageOverlay.classList.add('active');
                    
                    // Optional: Add a minimum loading time for better UX
                    setTimeout(() => {
                        // The form will submit naturally after this timeout
                        // This ensures the loading animation is visible for at least 500ms
                    }, 500);
                });
            });
            
            // Handle browser back button - remove loading states
            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    // Reset all loading states
                    document.querySelectorAll('.route-button').forEach(button => {
                        button.classList.remove('loading');
                        button.disabled = false;
                        button.style.opacity = '';
                        button.querySelector('.loading-spinner').classList.remove('active');
                    });
                    pageOverlay.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
