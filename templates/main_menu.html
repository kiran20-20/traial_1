<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Marg - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .buttons-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .main-button {
            background: white;
            color: #667eea;
            padding: 40px 60px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            text-align: center;
            min-width: 300px;
        }

        .main-button:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            background: #667eea;
            color: white;
        }

        .main-button i {
            display: block;
            font-size: 3em;
            margin-bottom: 20px;
        }

        .button-title {
            font-size: 1.3em;
            margin-bottom: 8px;
        }

        .button-subtitle {
            font-size: 0.7em;
            opacity: 0.8;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            color: #667eea;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .buttons-container {
                flex-direction: column;
                gap: 20px;
            }

            .main-button {
                min-width: 250px;
                padding: 30px 40px;
            }

            .logout-btn {
                position: static;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="/logout" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i> Logout
    </a>

    <div class="header">
        <h1>🗺️ स्मार्ट मार्ग / Smart Marg</h1>
        <p class="subtitle">Indian Oil Corporation Limited - Jamnagar</p>
    </div>

    <div class="buttons-container">
        <!-- Terminal Dashboard Button -->
        <a href="/terminal" class="main-button">
            <i class="fas fa-map-marked-alt"></i>
            <div class="button-title">सहेजे गए मार्ग</div>
            <div class="button-title">Saved Routes</div>
            <div class="button-subtitle">View & Manage Route Maps</div>
        </a>

        <!-- Create Route Form Button -->
        <a href="/create-route" class="main-button">
            <i class="fas fa-route"></i>
            <div class="button-title">नया मार्ग बनाएं</div>
            <div class="button-title">Create New Route</div>
            <div class="button-subtitle">Plan Safe Route with Hazard Detection</div>
        </a>
    </div>
</body>
</html>
