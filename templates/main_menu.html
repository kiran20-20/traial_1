<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Marg - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background: #003d82;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .top-bar .logo {
            font-size: 1.2em;
            font-weight: bold;
        }

        .logout-btn {
            background: white;
            color: #003d82;
            padding: 8px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid white;
        }

        .logout-btn:hover {
            background: transparent;
            color: white;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #003d82;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header .subtitle {
            font-size: 1.1em;
            color: #666;
        }

        .buttons-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .main-button {
            background: white;
            color: #003d82;
            padding: 50px 70px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.3em;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            text-align: center;
            min-width: 320px;
            border: 3px solid #e0e0e0;
        }

        .main-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,61,130,0.2);
            border-color: #003d82;
        }

        .main-button i {
            display: block;
            font-size: 3.5em;
            margin-bottom: 25px;
            color: #003d82;
        }

        .button-title {
            font-size: 1.2em;
            margin-bottom: 8px;
            color: #333;
        }

        .button-subtitle {
            font-size: 0.65em;
            color: #888;
            font-weight: 400;
            margin-top: 10px;
        }

        .footer {
            background: #003d82;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .buttons-container {
                flex-direction: column;
                gap: 25px;
            }

            .main-button {
                min-width: 280px;
                padding: 40px 50px;
            }

            .top-bar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <a href="/logout" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i> Logout
    </a>

    <div class="header">
        <h1>🗺️ इंडियन ऑयल स्मार्ट मार्ग /IndianOil Smart Marg</h1>
        <p class="subtitle">Indian Oil Corporation Limited</p>
    </div>

    <div class="buttons-container">
        <!-- Terminal Dashboard Button -->
        <a href="/terminal" class="main-button">
            <i class="fas fa-map-marked-alt"></i>
            <div class="button-title">सहेजे गए मार्ग</div>
            <div class="button-title">Saved Routes</div>
            <div class="button-subtitle">View & Manage Route Maps</div>
        </a>

        <!-- Create Route Form Button -->
        <a href="/create-route" class="main-button">
            <i class="fas fa-route"></i>
            <div class="button-title">नया मार्ग बनाएं</div>
            <div class="button-title">Create New Route</div>
            <div class="button-subtitle">Plan Safe Route with Hazard Detection</div>
        </a>
    </div>
</body>
</html>
