<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IndianOil Smart Marg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background: #003d82;
            color: white;
            padding: 15px 30px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .top-bar h1 {
            font-size: 1.3em;
            font-weight: 600;
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-container {
            background: white;
            padding: 50px 45px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            border: 1px solid #e0e0e0;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h2 {
            color: #003d82;
            font-size: 1.8em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .logo p {
            color: #666;
            font-size: 1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95em;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: all 0.3s;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #003d82;
            background: #f9f9f9;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #003d82;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #002a5c;
            box-shadow: 0 4px 15px rgba(0,61,130,0.3);
        }

        .alert {
            padding: 14px;
            border-radius: 5px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.95em;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .credentials {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 5px;
            margin-top: 25px;
            font-size: 0.9em;
            border: 1px solid #e0e0e0;
        }

        .credentials strong {
            display: block;
            margin-bottom: 10px;
            color: #333;
        }

        .credentials p {
            margin: 8px 0;
            color: #666;
            font-size: 0.9em;
        }

        .credentials code {
            background: white;
            padding: 3px 8px;
            border-radius: 3px;
            border: 1px solid #ddd;
            font-family: 'Courier New', monospace;
            color: #003d82;
        }

        .footer {
            background: #003d82;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 35px 30px;
            }

            .logo h2 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>🗺️ IndianOil Smart Marg</h1>
    </div>

    <div class="main-container">
        <div class="login-container">
            <div class="logo">
                <h2>Login</h2>
                <p>Route generation</p>
            </div>

            {% if error %}
                <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required autofocus>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>

            <div class="credentials">
                <strong> GSO : Jamnagar & Vadinar RC</strong>
            </div>
        </div>
    </div>

    <div class="footer">
        Indian Oil Corporation Limited
    </div>
</body>
</html>
